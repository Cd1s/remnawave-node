name: Deploy lib
on:
  push:
    paths:
      - 'libs/**/package.json'
      - '.github/workflows/deploy-lib.yml'

jobs:
  send-start-deploy-telegram-message:
    name: Send Telegram message
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Send Telegram message
        if: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_TOKEN != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏹 Deploy ${{ github.REPOSITORY }} npm package has started
            commit message: ${{ github.event.head_commit.message }}
            author: ${{ github.event.head_commit.author.name }}
            commit timestamp: ${{ github.event.head_commit.timestamp }}

      - name: Report skipped Telegram notification
        if: ${{ secrets.TELEGRAM_CHAT_ID == '' || secrets.TELEGRAM_TOKEN == '' }}
        run: echo 'telegram_notification=skipped reason=missing_credentials' >&2

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies and build
        working-directory: './libs/contract'
        run: npm i && npm run prepublish

      - name: Publish package on NPM
        working-directory: './libs/contract'
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_ref="${package_name}@${package_version}"
          registry='https://registry.npmjs.org'
          query_output=''
          set +e
          query_output="$(npm view "$package_ref" version --registry="$registry" 2>&1)"
          query_rc=$?
          set -e

          if [ "$query_rc" -eq 0 ] && [ -n "$query_output" ]; then
            echo "package_publish=skipped package=${package_ref} reason=already_exists"
            exit 0
          fi

          if [ "$query_rc" -ne 0 ]; then
            if [[ "$query_output" != *E404* && "$query_output" != *"404 Not Found"* ]]; then
              echo "$query_output" >&2
              echo "package_publish=failed package=${package_ref} reason=registry_query_error" >&2
              exit "$query_rc"
            fi
          elif [ -z "$query_output" ]; then
            echo "package_publish=failed package=${package_ref} reason=empty_registry_query" >&2
            exit 1
          fi

          npm publish --access public
          echo "package_publish=published package=${package_ref}"

  send-telegram-message:
    name: Send Telegram message
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Send Telegram message
        if: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_TOKEN != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ ${{ github.REPOSITORY }} npm package published
            image tag: *${{ github.sha }}*
            commit message: ${{ github.event.head_commit.message }}
            author: ${{ github.event.head_commit.author.name }}
            commit timestamp: ${{ github.event.head_commit.timestamp }}

      - name: Report skipped Telegram notification
        if: ${{ secrets.TELEGRAM_CHAT_ID == '' || secrets.TELEGRAM_TOKEN == '' }}
        run: echo 'telegram_notification=skipped reason=missing_credentials' >&2

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [build]
    if: failure()
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Send error notification
        if: ${{ secrets.TELEGRAM_CHAT_ID != '' && secrets.TELEGRAM_TOKEN != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ ${{ github.REPOSITORY }} deploy NPM package failed.

      - name: Report skipped Telegram notification
        if: ${{ secrets.TELEGRAM_CHAT_ID == '' || secrets.TELEGRAM_TOKEN == '' }}
        run: echo 'telegram_notification=skipped reason=missing_credentials' >&2
