name: Build isolated Xray compatibility image

on:
  workflow_dispatch:
    inputs:
      xray_core_version:
        description: Official Xray Core release, for example v26.6.27
        required: true
        default: v26.6.27
        type: string
      image_tag:
        description: Required immutable tag, for example xray-v26.6.27-us-compat-20260803
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: xray-compat-image-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-node

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate isolated image inputs
        env:
          XRAY_CORE_VERSION: ${{ inputs.xray_core_version }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          xray_core_version="$XRAY_CORE_VERSION"
          image_tag="$IMAGE_TAG"
          if [[ ! "$xray_core_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid Xray core version" >&2
            exit 1
          fi
          if [[ ! "$image_tag" =~ ^xray-v[0-9]+\.[0-9]+\.[0-9]+-us-compat-[0-9]{8}$ ]] || [[ "$image_tag" == "singbox" || "$image_tag" == "latest" ]]; then
            echo "invalid or reserved image tag" >&2
            exit 1
          fi

      - name: Validate workflow contract
        run: bash .github/tests/test-xray-compat-image-workflow.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.7

      - name: Install sing-box 1.13.14 fixture validator
        run: |
          go install -tags with_v2ray_api,with_clash_api,with_quic,with_utls github.com/sagernet/sing-box/cmd/sing-box@v1.13.14
          echo "SINGBOX_BIN=$(go env GOPATH)/bin/sing-box" >> "$GITHUB_ENV"

      - run: npm run validate:dual-core

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated compatibility image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag }}
          build-args: |
            RWNODE_VERSION=3.0.0
            XRAY_CORE_VERSION=${{ inputs.xray_core_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report published digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
