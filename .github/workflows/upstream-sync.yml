name: Sync upstream

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: upstream-sync-node
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-node

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/node.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run trace

      - name: Check dual-core files
        run: |
          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml'
          )
          if ((${#format_files[@]})); then
            npx oxfmt --check "${format_files[@]}"
          fi
          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs'
          )
          if ((${#lint_files[@]})); then
            npx oxlint "${lint_files[@]}"
          fi

      - name: Push tested merge
        run: git push origin HEAD:singbox

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
