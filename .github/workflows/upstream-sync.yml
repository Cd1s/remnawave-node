name: Sync upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

# `workflows` is a GitHub App/PAT repository permission, not an Actions `permissions` key.
# WORKFLOW_TOKEN must grant contents:write + workflows:write; package/release access is
# preflighted before any image build.

concurrency:
  group: upstream-sync-node
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cd1s/remnawave-node

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: singbox
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Resolve official latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: remnawave/node
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh resolve
      - name: Detect and merge upstream
        id: sync
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/remnawave/node.git
          git fetch --no-tags upstream main
          bash .github/scripts/upstream-sync-lib.sh merge
      - name: Verify package version from official release commit
        if: steps.sync.outcome == 'success'
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
          PACKAGE_PATHS: package.json,libs/contract/package.json
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: bash .github/scripts/upstream-sync-lib.sh package
      - uses: actions/setup-node@v4
        if: steps.sync.outcome == 'success'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.sync.outcome == 'success'
      - uses: actions/setup-go@v5
        if: steps.sync.outcome == 'success'
        with:
          go-version: 1.24.7
      - name: Install sing-box 1.13.14 fixture validator
        if: steps.sync.outcome == 'success'
        run: |
          go install -tags with_v2ray_api,with_clash_api,with_quic,with_utls github.com/sagernet/sing-box/cmd/sing-box@v1.13.14
          echo "SINGBOX_BIN=$(go env GOPATH)/bin/sing-box" >> "$GITHUB_ENV"
      - run: npm run validate:dual-core
        if: steps.sync.outcome == 'success'
      - run: npm run build
        if: steps.sync.outcome == 'success'
      - run: npm run trace
        if: steps.sync.outcome == 'success'
      - run: npm run typecheck
        if: steps.sync.outcome == 'success'
      - run: npm run check
        if: steps.sync.outcome == 'success'
      - name: Check dual-core files
        if: steps.sync.outcome == 'success'
        env:
          UPSTREAM_REF: ${{ steps.release.outputs.commit }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$UPSTREAM_REF"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml')
          if ((${#files[@]})); then npx oxfmt --check "${files[@]}"; npx oxlint "${files[@]}"; fi
      - name: Verify write capabilities before any image build
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_CHANGED: ${{ steps.sync.outputs.workflow_changed }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SYNC_REPORT_PATH: ${{ runner.temp }}/upstream-sync-report.md
        run: |
          set -euo pipefail
          push_token="$GITHUB_TOKEN"
          if [ "$WORKFLOW_CHANGED" = true ]; then
            test -n "$WORKFLOW_TOKEN" || { echo 'upstream_sync=failed reason=missing_WORKFLOW_TOKEN workflow_files_changed' >&2; exit 1; }
            push_token="$WORKFLOW_TOKEN"
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$push_token" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          bash .github/scripts/upstream-sync-lib.sh preflight

      - name: Resolve final fork commit and version
        id: source
        if: steps.sync.outcome == 'success'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Push tested merge
        if: steps.sync.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          WORKFLOW_CHANGED: ${{ steps.sync.outputs.workflow_changed }}
        run: |
          set -euo pipefail
          push_token="$GITHUB_TOKEN"
          if [ "$WORKFLOW_CHANGED" = true ]; then
            test -n "$WORKFLOW_TOKEN" || { echo 'upstream_sync=failed reason=missing_WORKFLOW_TOKEN workflow_files_changed' >&2; exit 1; }
            push_token="$WORKFLOW_TOKEN"
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf 'x-access-token:%s' "$push_token" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
          git push origin HEAD:singbox
      - name: Verify pushed final commit
        if: steps.sync.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          remote_sha="$(git ls-remote origin refs/heads/singbox | awk 'NR == 1 { print $1 }')"
          test "$remote_sha" = "$EXPECTED_SHA" || { echo "release_sync=failed reason=remote_branch_not_at_final_commit expected=$EXPECTED_SHA actual=${remote_sha:-missing}" >&2; exit 1; }
      - uses: docker/setup-qemu-action@v3
        if: steps.sync.outcome == 'success'
      - uses: docker/setup-buildx-action@v3
        if: steps.sync.outcome == 'success'
      - uses: docker/login-action@v3
        if: steps.sync.outcome == 'success'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        if: steps.sync.outcome == 'success'
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            RWNODE_VERSION=${{ steps.source.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sync official fork Release
        if: steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
          FORK_COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM_REPO: remnawave/node
          UPSTREAM_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_RELEASE_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sync-release.sh sync
      - name: Upload auditable upstream failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report-${{ github.run_id }}
          path: ${{ runner.temp }}/upstream-sync-report.md
          if-no-files-found: warn
