name: Sing-box CI and GHCR

on:
  push:
    branches:
      - singbox
  pull_request:
    branches:
      - singbox
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: singbox-node-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cd1s/remnawave-node

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.7

      - name: Install sing-box 1.13.14 fixture validator
        run: |
          go install -tags with_v2ray_api,with_clash_api,with_quic,with_utls github.com/sagernet/sing-box/cmd/sing-box@v1.13.14
          echo "SINGBOX_BIN=$(go env GOPATH)/bin/sing-box" >> "$GITHUB_ENV"

      - run: npm run validate:dual-core
      - run: npm run build
      - run: npm run trace
      - run: npm run typecheck

      - name: Check dual-core files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base_sha="${BASE_SHA:-}"
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha"...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml'
          )
          if ((${#format_files[@]})); then
            npx oxfmt --check "${format_files[@]}"
          fi
          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha"...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs'
          )
          if ((${#lint_files[@]})); then
            npx oxlint "${lint_files[@]}"
          fi

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve node version
        id: version
        run: |
          node_version="$(node -p "require('./package.json').version")"
          echo "version=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RWNODE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
