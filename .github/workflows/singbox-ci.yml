name: Sing-box CI and GHCR

on:
  push:
    branches:
      - singbox
  pull_request:
    branches:
      - singbox
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: singbox-node-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cd1s/remnawave-node

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run trace

      - name: Check dual-core files
        run: |
          git fetch --no-tags https://github.com/remnawave/node.git \
            main:refs/remotes/upstream/main
          mapfile -t format_files < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml'
          )
          if ((${#format_files[@]})); then
            npx oxfmt --check "${format_files[@]}"
          fi
          mapfile -t lint_files < <(
            git diff --name-only --diff-filter=ACMR upstream/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs'
          )
          if ((${#lint_files[@]})); then
            npx oxlint "${lint_files[@]}"
          fi

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve node version
        id: version
        run: |
          node_version="$(node -p "require('./package.json').version")"
          echo "version=${node_version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:singbox
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RWNODE_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
